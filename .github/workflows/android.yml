name: Diagnosticar e Compilar Jarvis Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    name: Testar e compilar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --version

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar versão do Gradle
        run: gradle --version

      - name: Executar testes disponíveis
        run: gradle testDebugUnitTest

      - name: Verificar código Android
        run: gradle lintDebug

      - name: Compilar aplicativo
        run: gradle assembleDebug

      - name: Salvar relatório de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio-diagnostico
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
